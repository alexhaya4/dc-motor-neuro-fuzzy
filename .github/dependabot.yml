version: 2
updates:
  # Resolve pip-compile updates against the Python 3.11 baseline in .python-version.
  # CI also verifies the resulting hash-locked dependencies on Python 3.12.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tensorflow:
        patterns: [tensorflow, keras, numpy, scipy, ml-dtypes, h5py]
      development:
        patterns: [pytest, pytest-cov, ruff, pip-audit]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
