version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tensorflow:
        patterns: [tensorflow, keras, numpy, scipy, ml-dtypes, h5py]
      development:
        patterns: [pytest, pytest-cov, ruff, pip-audit]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
