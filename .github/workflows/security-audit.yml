name: Software checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Check Python errors and shell syntax
        run: |
          python -m ruff check --select E9,F .
          bash -n install.sh run.sh deploy_to_pi.sh
      - name: Run software tests
        run: python -m pytest tests --cov=base_controller --cov=conventional_controllers --cov=control_runtime --cov=motor_hardware --cov=nn_models --cov=performance_metrics --cov=improved_data_collection --cov=auto_tuner --cov-report=xml --cov-report=term-missing
      - name: Audit runtime and GPIO dependency locks
        if: matrix.python == '3.12'
        run: |
          python -m pip_audit --disable-pip --require-hashes -r requirements.txt --progress-spinner off
          python -m pip_audit --disable-pip --require-hashes -r requirements-pi.txt --progress-spinner off
          python -m pip_audit --disable-pip --require-hashes -r requirements-dev.txt --progress-spinner off
      - name: Upload software coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  codeql-analysis:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: .github/workflows/security-audit.yml:codeql-analysis
          output: codeql-results
      - name: Check security and quality findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path('codeql-results').glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL did not produce a SARIF report.')
          count = 0
          for report in reports:
              for run in json.loads(report.read_text())['runs']:
                  for result in run.get('results', []):
                      count += 1
                      print(json.dumps(result, sort_keys=True))
          print(f'CodeQL security and quality findings: {count}')
          if count:
              raise SystemExit('Resolve CodeQL findings before releasing.')
          PY
      - name: Verify GitHub alert status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          endpoint = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/code-scanning/alerts'
          count = 0
          page = 1
          while True:
              query = urllib.parse.urlencode({'state': 'open', 'ref': os.environ['GITHUB_REF'], 'per_page': 100, 'page': page})
              request = urllib.request.Request(endpoint + '?' + query, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  alerts = json.load(response)
              count += len(alerts)
              if len(alerts) < 100:
                  break
              page += 1
          print(f'Open code-scanning alerts on main: {count}')
          if count:
              raise SystemExit('GitHub still reports open alerts; review the scan configurations.')
          PY
      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          if-no-files-found: error

  release:
    name: Publish versioned release
    needs: [tests, codeql-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: source-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release from version and changelog
        id: metadata
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ['BEFORE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', before), 'Invalid previous commit'
          if before != '0' * 40:
              subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], check=True)
              changed = subprocess.run(['git', 'diff', '--quiet', before, os.environ['GITHUB_SHA'], '--', 'VERSION'])
              assert changed.returncode in (0, 1), 'Cannot inspect version change'
              if changed.returncode == 0:
                  print('VERSION unchanged; no release requested.')
                  raise SystemExit(0)

          version = Path('VERSION').read_text().strip()
          number = r'(?:0|[1-9][0-9]*)'
          assert re.fullmatch(fr'{number}\.{number}\.{number}', version), 'Use a stable semantic version'
          if before != '0' * 40:
              previous = subprocess.run(['git', 'show', before + ':VERSION'], capture_output=True, text=True)
              if previous.returncode == 0:
                  old_version = previous.stdout.strip()
                  assert re.fullmatch(fr'{number}\.{number}\.{number}', old_version), 'Invalid previous version'
                  assert tuple(map(int, version.split('.'))) > tuple(map(int, old_version.split('.'))), 'Version must increase'
          citation = Path('CITATION.cff').read_text()
          assert f'version: "{version}"' in citation.split('preferred-citation:')[0], 'Citation version differs'
          changelog = Path('CHANGELOG.md').read_text()
          match = re.search(r'^## \[' + re.escape(version) + r'\] - (\d{4}-\d{2}-\d{2})\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert match and match[2].strip(), 'Missing release notes'
          datetime.date.fromisoformat(match[1])
          assert f'date-released: {match[1]}' in citation.split('preferred-citation:')[0], 'Citation date differs'
          notes = match[2].strip()
          notes += '\n\nSource commit: `' + os.environ['GITHUB_SHA'] + '`.'
          run_url = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          notes += '\n\nValidation: [Software checks](' + run_url + ').\n'
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish=true\ntag=v{version}\n')
          PY
      - name: Publish checked commit and release notes
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          assert re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', tag)
          base = os.environ['GITHUB_API_URL'] + '/repos/' + repository

          def request(path, payload=None, allow_missing=False):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2026-03-10',
                         'Content-Type': 'application/json'}
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_missing and exc.code == 404:
                      return None
                  raise SystemExit(f'GitHub request failed: HTTP {exc.code} for {path}') from None

          encoded_tag = urllib.parse.quote(tag, safe='')
          reference = request('/git/ref/tags/' + encoded_tag, allow_missing=True)
          if reference:
              target = reference['object']
              for _ in range(10):
                  if target['type'] != 'tag':
                      break
                  target = request('/git/tags/' + target['sha'])['object']
              assert target['type'] == 'commit' and target['sha'] == commit, 'Existing tag points elsewhere; refusing to move it'

          release = request('/releases/tags/' + encoded_tag, allow_missing=True)
          if release:
              assert reference and not release['draft'] and not release['prerelease'], 'Existing release does not match a published stable release'
              print('Release already published: ' + release['html_url'])
          else:
              notes = Path(os.environ['RUNNER_TEMP'], 'release-notes.md').read_text()
              release = request('/releases', {'tag_name': tag, 'target_commitish': commit,
                                            'name': tag, 'body': notes, 'draft': False,
                                            'prerelease': False, 'make_latest': 'true'})
              print('Published: ' + release['html_url'])
          PY
