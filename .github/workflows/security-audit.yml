name: Software checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Check Python errors and shell syntax
        run: |
          python -m ruff check --select E9,F63,F7,F82 .
          bash -n install.sh run.sh deploy_to_pi.sh
      - name: Run software tests
        run: python -m pytest tests --cov=base_controller --cov=conventional_controllers --cov=control_runtime --cov=motor_hardware --cov=nn_models --cov=performance_metrics --cov=improved_data_collection --cov=auto_tuner --cov-report=xml --cov-report=term-missing
      - name: Audit runtime and GPIO dependency locks
        if: matrix.python == '3.12'
        run: |
          python -m pip_audit --disable-pip --require-hashes -r requirements.txt --progress-spinner off
          python -m pip_audit --disable-pip --require-hashes -r requirements-pi.txt --progress-spinner off
      - name: Upload software coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
