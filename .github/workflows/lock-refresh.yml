# Temporary, branch-restricted lockfile regeneration. Remove after validated output.
name: One-time locked dependency regeneration
on:
  push:
    branches:
      - security/fail-safe-validation-and-dependency-install
    paths:
      - .github/workflows/lock-refresh.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'alexhaya4/dc-motor-neuro-fuzzy' && github.ref == 'refs/heads/security/fail-safe-validation-and-dependency-install'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/fail-safe-validation-and-dependency-install
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned lockfile generator
        run: python -m pip install 'pip-tools==7.6.2'
      - name: Resolve and regenerate all three hash-locked environments
        shell: bash
        run: |
          set -euo pipefail
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file=requirements.txt requirements.in
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file=requirements-dev.txt requirements-dev.in
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file=requirements-pi.txt requirements-pi.in
      - name: Check every lock contains patched versions
        run: |
          python - <<'PY'
          from pathlib import Path
          pins = {'pillow': '13.0.0', 'certifi': '2026.10.23', 'setuptools': '84.1.0'}
          for name in ('requirements.txt', 'requirements-pi.txt', 'requirements-dev.txt'):
              data = Path(name).read_text()
              for pkg, version in pins.items():
                  assert f'{pkg}=={version} ' in data, (name, pkg, version)
              if name == 'requirements-dev.txt':
                  assert 'filelock==4.2.4 ' in data
          PY
      - name: Commit regenerated dependency locks to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt requirements-dev.txt requirements-pi.txt
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
          else
            git commit -m 'Regenerate security-patched hash-locked dependencies'
            git push origin HEAD:refs/heads/security/fail-safe-validation-and-dependency-install
          fi
