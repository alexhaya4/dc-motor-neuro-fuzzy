<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Three learned scaling channels around a Mamdani controller</title>
  <desc id="desc">Target and measured speed percentages feed three independent models with embedded normalization. Error and change-in-error factors range from 0.5 to 2.0; output scaling ranges from 0.5 to 1.5. The controller scales and clamps the fuzzy inputs, computes the Mamdani output, then scales and bounds PWM. Missing requested model files cause fuzzy-only operation with all factors equal to one.</desc>
  <defs>
    <pattern id="rule" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24H24" stroke="#ded8cb" stroke-width=".6"/></pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#292a25"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#a53b28"/></marker>
    <style>
      text{fill:#292a25;font-family:Arial,Helvetica,sans-serif}
      .headline{font-family:Georgia,'Times New Roman',serif;font-size:36px}
      .mono{font-family:'Courier New',monospace;font-size:13px}
      .small{font-size:13px;fill:#625f55}
      .red{fill:#a53b28}
      .wire{fill:none;stroke:#292a25;stroke-width:1.6}
      .label{font-size:17px;font-weight:700}
    </style>
    <g id="network" class="wire">
      <path d="M0 -13L35 -18M0 -13L35 0M0 -13L35 18M0 13L35 -18M0 13L35 0M0 13L35 18M35 -18L70 0M35 0L70 0M35 18L70 0" stroke="#b7afa0"/>
      <g fill="#f4f0e6"><circle cx="0" cy="-13" r="5"/><circle cx="0" cy="13" r="5"/><circle cx="35" cy="-18" r="5"/><circle cx="35" cy="0" r="5"/><circle cx="35" cy="18" r="5"/></g>
      <circle cx="70" cy="0" r="6" fill="#a53b28" stroke="#a53b28"/>
    </g>
  </defs>
  <path fill="#f4f0e6" d="M0 0H1280V720H0Z"/>
  <path d="M36 34V128" stroke="#a53b28" stroke-width="5"/>
  <text x="55" y="48" class="mono red">02 / NEURAL SCALING</text>
  <text x="53" y="93" class="headline">Three learned scaling channels</text>
  <text x="55" y="123" class="small">Three independent predictions shape one Mamdani control action.</text>
  <text x="1242" y="47" text-anchor="end" class="mono">DC MOTOR / MODEL PATH</text>
  <path d="M36 148H1244" stroke="#292a25"/>
  <path fill="url(#rule)" d="M302 168H1244V586H302Z"/>

  <text x="55" y="205" class="mono red">FEATURE PAIR</text>
  <text x="55" y="250" font-family="Georgia,serif" font-size="28" font-style="italic">x = [r, y]</text>
  <text x="55" y="280" class="small">Target + measured speed</text>
  <text x="55" y="304" class="mono">Raw percentages</text>
  <text x="55" y="325" class="mono">0 to 100</text>
  <path d="M55 350H255M255 244V516M255 244H313M255 380H313M255 516H313" class="wire"/>
  <circle cx="255" cy="350" r="4" fill="#292a25"/>
  <text x="55" y="397" class="small">Normalization is inside</text>
  <text x="55" y="417" class="small">each saved model.</text>

  <g>
    <text x="330" y="201" class="mono">error_scale.keras</text>
    <path d="M321 216H674V272H321Z" fill="#f4f0e6" stroke="#292a25" stroke-width="1.6"/>
    <text x="338" y="249" class="mono">/100</text>
    <path d="M386 244H418" class="wire" marker-end="url(#arrow)"/>
    <use xlink:href="#network" transform="translate(433 244)"/>
    <path d="M511 244H538" class="wire" marker-end="url(#arrow)"/>
    <text x="551" y="249" class="mono">sigmoid</text>
    <path d="M674 244H885" fill="none" stroke="#a53b28" stroke-width="2" marker-end="url(#red-arrow)"/>
    <text x="700" y="225" class="mono red">k_e</text>
    <text x="700" y="270" class="mono">0.5 to 2.0</text>
  </g>
  <g>
    <text x="330" y="337" class="mono">delta_error_scale.keras</text>
    <path d="M321 352H674V408H321Z" fill="#f4f0e6" stroke="#292a25" stroke-width="1.6"/>
    <text x="338" y="385" class="mono">/100</text>
    <path d="M386 380H418" class="wire" marker-end="url(#arrow)"/>
    <use xlink:href="#network" transform="translate(433 380)"/>
    <path d="M511 380H538" class="wire" marker-end="url(#arrow)"/>
    <text x="551" y="385" class="mono">sigmoid</text>
    <path d="M674 380H885" fill="none" stroke="#a53b28" stroke-width="2" marker-end="url(#red-arrow)"/>
    <text x="700" y="361" class="mono red">k_de</text>
    <text x="700" y="406" class="mono">0.5 to 2.0</text>
  </g>
  <g>
    <text x="330" y="473" class="mono">output_scale.keras</text>
    <path d="M321 488H674V544H321Z" fill="#f4f0e6" stroke="#292a25" stroke-width="1.6"/>
    <text x="338" y="521" class="mono">/100</text>
    <path d="M386 516H418" class="wire" marker-end="url(#arrow)"/>
    <use xlink:href="#network" transform="translate(433 516)"/>
    <path d="M511 516H538" class="wire" marker-end="url(#arrow)"/>
    <text x="551" y="521" class="mono">sigmoid</text>
    <path d="M674 516H885" fill="none" stroke="#a53b28" stroke-width="2" marker-end="url(#red-arrow)"/>
    <text x="700" y="497" class="mono red">k_u</text>
    <text x="700" y="542" class="mono">0.5 to 1.5</text>
  </g>

  <path d="M903 181H1243V565H903Z" fill="#f4f0e6" stroke="#292a25" stroke-width="2"/>
  <path d="M903 181H1243V219H903Z" fill="#292a25"/>
  <text x="924" y="206" class="mono" style="fill:#f4f0e6">ONE CONTROL STEP</text>
  <text x="925" y="253" class="mono">e = r - y</text>
  <text x="925" y="277" class="mono">de = e - previous_e</text>
  <path d="M925 296H1221" stroke="#c4bcad"/>
  <text x="925" y="328" class="label">Scale the fuzzy inputs</text>
  <text x="925" y="355" class="mono">k_e * e, k_de * de</text>
  <text x="925" y="377" class="small">Clamp each input to [-100, 100].</text>
  <path d="M925 396H1221" stroke="#c4bcad"/>
  <text x="925" y="429" class="label">Mamdani inference</text>
  <text x="925" y="455" class="small">The fixed rule base produces v.</text>
  <path d="M925 474H1221" stroke="#c4bcad"/>
  <text x="925" y="508" class="label">Scale and bound PWM</text>
  <text x="925" y="536" class="mono red">u = clip(k_u * v, 0, 100)</text>

  <path d="M36 592H1244" stroke="#292a25"/>
  <text x="55" y="621" class="mono red">MODEL GATE</text>
  <text x="55" y="647" class="small">Requested model files must pass checksum and loading checks.</text>
  <text x="715" y="621" class="mono">EXPLICIT FALLBACK</text>
  <text x="715" y="647" class="small">Missing requested models: fuzzy-only, all factors = 1.</text>
  <text x="55" y="693" class="mono small">NETWORK SYMBOLS SHOW DATA FLOW, NOT LAYER WIDTHS.</text>
  <text x="1244" y="693" text-anchor="end" class="mono small">INFERENCE / NO ONLINE WEIGHT UPDATES</text>
</svg>
